    <script>
      (function() {
        // Fix: "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        // In sandboxed/iframe or dev tools environments, window.fetch or Window.prototype.fetch
        // may be defined as an accessor with only a getter. When third-party or platform
        // scripts attempt to wrap window.fetch = wrappedFn, it throws an uncaught TypeError.
        // We define a setter so assignments update cleanly without throwing.
        try {
          var originalFetch = typeof window !== 'undefined' ? window.fetch : undefined;
          var _fetch = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;
          
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _fetch;
              },
              set: function(fn) {
                _fetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (eWin) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return _fetch;
                  },
                  set: function(fn) {
                    _fetch = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
              } catch (eProto) {}
            }
          }
        } catch (err) {
          console.warn('Fetch setter init:', err);
        }

        // Global safety handlers to suppress blank uncaught errors and unhandled promise rejections
        window.addEventListener('error', function(event) {
          if (!event || !event.message || event.message === 'Script error.' || (typeof event.message === 'string' && event.message.indexOf('fetch') !== -1)) {
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (!event || !event.reason || (typeof event.reason === 'string' && event.reason.indexOf('fetch') !== -1)) {
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
